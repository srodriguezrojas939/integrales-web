<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de Integrales</title>

  <!-- Algebrite -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/algebrite/1.5.0/algebrite.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      padding-top: 40px;
    }
    .card {
      background: white;
      padding: 25px;
      width: 420px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .result {
      margin-top: 15px;
      background: #eee;
      padding: 10px;
      min-height: 40px;
      font-family: monospace;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>Calculadora de Integrales</h2>

    <input id="expr" placeholder="Ej: x^2, sin(x), exp(x)">

    <select id="tipo">
      <option value="indef">Indefinida</option>
      <option value="def">Definida</option>
    </select>

    <input id="a" placeholder="Límite inferior (solo definida)">
    <input id="b" placeholder="Límite superior (solo definida)">

    <button onclick="resolver()">Resolver</button>

    <div class="result" id="resultado"></div>
  </div>

<script>
function resolver() {
  const expr = document.getElementById("expr").value;
  const tipo = document.getElementById("tipo").value;
  const a = document.getElementById("a").value;
  const b = document.getElementById("b").value;
  const res = document.getElementById("resultado");

  try {
    let salida = "";

    if (tipo === "indef") {
      salida = Algebrite.integral(expr).toString();
    } else {
      salida = Algebrite.integral(expr, "x", a, b).toString();
    }

    res.textContent = salida;
  } catch (e) {
    res.textContent = "Error en la expresión.";
  }
}
</script>

</body>
</html>
