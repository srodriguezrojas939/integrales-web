<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Integrales Pro</title>

    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/nerdamer.core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Algebra.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Calculus.js"></script>
    
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$']] }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap');

        /* ANIMACIÓN FADE IN GENERAL */
        .fade-in {
            opacity: 0;
            transform: translateY(25px);
            animation: fadeUp 0.9s ease forwards;
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body {
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* CONTENEDOR PRINCIPAL */
        .calculadora-moderna {
            max-width: 650px;
            width: 100%;
            margin: 10px auto;
            padding: 40px 30px;
            background: #F2F2F2;
            border-radius: 35px;
            font-family: 'Open Sans', sans-serif;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        /* TÍTULOS */
        .header-section {
            text-align: center;
            margin-bottom: 28px;
            opacity: 0;
            transform: translateY(-20px);
            animation: titleFadeIn 1s ease forwards;
            animation-delay: 0.5s;
        }

        .header-section h1 {
            font-size: 40px;
            font-weight: 600;
            margin: 0;
            font-family: 'Playfair Display', serif;
            color: black;
        }

        .header-section p {
            font-size: 20px;
            font-weight: 600; /* NEGRITA APLICADA */
            margin-top: 5px;
            font-family: 'Playfair Display', serif;
            color: #333;
        }

        @keyframes titleFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* LABELS E INPUTS */
        label {
            display: block;
            font-size: 15px;
            margin-bottom: 8px;
            margin-left: 10px;
            color: #333;
        }

        input, select {
            width: 100%;
            font-family: 'Open Sans', sans-serif;
            font-size: 15px;
            padding: 14px;
            margin-bottom: 22px;
            border: 1px solid #ccc;
            border-radius: 30px;
            background: white;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #999;
            box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* BOTONES */
        .botones-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
        }

        .boton-estilo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 35px;
            padding: 14px 22px;
            font-family: 'Open Sans', sans-serif;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: black;
            text-decoration: none;
        }

        .boton-estilo:hover {
            background: #e6e6e6;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .boton-estilo:active {
            transform: scale(0.98);
        }

        .boton-estilo img {
            width: 22px;
            height: 22px;
        }

        .boton-principal {
            background: black;
            color: white;
            border: none;
            font-weight: 600;
        }

        .boton-principal:hover {
            background: #333;
        }

        /* ÁREA DE RESULTADO */
        #resultado {
            margin-top: 30px;
            padding: 25px;
            background: white;
            border-radius: 25px;
            min-height: 50px;
            text-align: center;
            font-size: 1.3rem;
            border: 1px solid #eee;
            overflow-x: auto;
        }

    </style>
</head>
<body>

<div class="fade-in">
    <div class="calculadora-moderna">
        
        <div class="header-section">
            <h1>Calculadora de integrales</h1>
            <p>√(Raiz) Cuadrada²</p>
        </div>

        <label>Función a integrar</label>
        <input id="funcion" placeholder="Ej: x^2 + sin(x)" type="text">

        <div class="row">
            <div>
                <label>Tipo</label>
                <select id="tipo">
                    <option value="indef">Indefinida</option>
                    <option value="def">Definida</option>
                </select>
            </div>
            <div>
                <label>Variable</label>
                <select id="variable">
                    <option value="x">dx</option>
                    <option value="t">dt</option>
                    <option value="u">du</option>
                </select>
            </div>
        </div>

        <div class="row" id="limites" style="display:none;">
            <div>
                <label>Límite inferior (a)</label>
                <input id="a" placeholder="0">
            </div>
            <div>
                <label>Límite superior (b)</label>
                <input id="b" placeholder="pi">
            </div>
        </div>

        <div class="botones-container">
            <button onclick="calcular()" class="boton-estilo boton-principal">
                Calcular Resultado
            </button>

            <button onclick="irAPasoAPaso()" class="boton-estilo">
                <img src="https://cdn-icons-png.flaticon.com/512/2374/2374367.png" alt="pasos">
                Ver paso a paso (MathDF)
            </button>
        </div>

        <div id="resultado">Esperando función...</div>
    </div>
</div>

<script>
function normalizar(expr) {
    if (!expr) return "";
    let e = expr.toLowerCase().replace(/\s+/g, '');
    e = e.replace(/π/g, 'pi');
    e = e.replace(/ln/g, 'log');
    e = e.replace(/(sin|cos|tan|sec|csc|cot|log)(\d*[a-z])/g, '$1($2)');
    return e;
}

function calcular() {
    const funcionInput = document.getElementById('funcion').value.trim();
    const tipo = document.getElementById('tipo').value;
    const v = document.getElementById('variable').value;
    const out = document.getElementById('resultado');

    if (!funcionInput) {
        out.innerHTML = "Ingresa una función";
        return;
    }

    try {
        const f = normalizar(funcionInput);
        let latex = "";

        if (tipo === 'indef') {
            const F = nerdamer.integrate(f, v);
            latex = `\\int ${nerdamer(f).toTeX()}\\, d${v} = ${F.toTeX()} + C`;
        } else {
            const valA = document.getElementById('a').value.trim();
            const valB = document.getElementById('b').value.trim();
            if (valA === "" || valB === "") {
                out.innerHTML = "<span style='color:red'>Faltan límites</span>";
                return;
            }
            const a = normalizar(valA);
            const b = normalizar(valB);
            const resultadoDef = nerdamer(`defint(${f}, ${a}, ${b}, ${v})`);
            latex = `\\int_{${nerdamer(a).toTeX()}}^{${nerdamer(b).toTeX()}} ${nerdamer(f).toTeX()}\\, d${v} = ${resultadoDef.toTeX()}`;
        }

        out.innerHTML = `$$${latex}$$`;
        MathJax.typesetPromise([out]);

    } catch (error) {
        out.innerHTML = "<span style='color:red'>Error de sintaxis</span>";
    }
}

function irAPasoAPaso() {
    const f = document.getElementById('funcion').value.trim();
    const v = document.getElementById('variable').value;
    
    if (!f) {
        alert("Por favor, escribe una función primero.");
        return;
    }

    const funcionLimpia = encodeURIComponent(f);
    const url = `https://mathdf.com/int/es/?expr=${funcionLimpia}&v=${v}`;
    window.open(url, '_blank');
}

document.getElementById('tipo').addEventListener('change', e => {
    document.getElementById('limites').style.display = (e.target.value === 'def') ? 'grid' : 'none';
});
</script>

</body>


</html>
