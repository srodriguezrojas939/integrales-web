<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculadora de Integrales Pro</title>

    <script src="https://cdn.jsdelivr.net/npm/algebrite@1.4.0/dist/algebrite.bundle-for-browser.min.js"></script>
    
    <script>
        window.MathJax = {
            tex: { 
                inlineMath: [['$', '$'], ['\\(', '\\)']], 
                displayMath: [['$$', '$$']],
                // Macro obligatoria para que log se vea siempre como ln
                macros: {
                    log: '\\ln',
                    ln: '\\ln'
                }
            },
            options: { enableMenu: false }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap');

        body { background: white; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; margin: 0; padding: 10px; box-sizing: border-box; }
        .fade-in { opacity: 0; transform: translateY(20px); animation: fadeUp 0.8s ease forwards; width: 100%; max-width: 600px; }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

        .calculadora { background: #F2F2F2; padding: 30px 20px; border-radius: 35px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); box-sizing: border-box; width: 100%; }
        .header-section { text-align: center; margin-bottom: 20px; }
        .header-section h1 { font-family: 'Playfair Display', serif; font-size: 32px; margin: 0; font-weight: 600; text-transform: lowercase; }
        .header-section p { font-family: 'Playfair Display', serif; font-size: 18px; margin: 5px 0; font-weight: 600; }

        #preview-container { background: white; margin-bottom: 20px; padding: 20px; border-radius: 20px; min-height: 70px; display: flex; align-items: center; justify-content: center; border: 1px solid #eee; overflow-x: auto; }

        /* DISTANCIA DE 34PX SOLICITADA */
        #resultado {
            background: white; 
            margin-top: 34px; 
            padding: 25px;
            border-radius: 20px; 
            min-height: 80px; 
            display: flex;
            align-items: center; 
            justify-content: center; 
            border: 1px solid #eee;
            overflow-x: auto; 
            font-size: 1.2rem;
            color: #333;
        }

        label { display: block; font-family: 'Open Sans', sans-serif; font-size: 14px; color: #444; margin: 0 0 6px 12px; font-weight: 600; }
        input, select { width: 100%; padding: 14px 18px; margin-bottom: 15px; border-radius: 25px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; outline: none; font-family: 'Open Sans', sans-serif; background-color: white; }

        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .botones-container { display: flex; flex-direction: column; gap: 12px; }

        .btn-principal { width: 100%; background: black; color: white; border: none; padding: 18px; border-radius: 30px; font-size: 16px; cursor: pointer; font-family: 'Open Sans', sans-serif; font-weight: 700; }
        .btn-secundario { width: 100%; background: white; color: #333; border: 1px solid #ccc; padding: 15px; border-radius: 30px; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; font-family: 'Open Sans', sans-serif; }

        @media (max-width: 450px) { .header-section h1 { font-size: 28px; } .row { grid-template-columns: 1fr; gap: 0; } }
    </style>
</head>
<body>

<div class="fade-in">
    <div class="calculadora">
        <div class="header-section">
            <h1>calculadora de integrales</h1>
            <p>√(Raiz) Cuadrada²</p>
        </div>

        <div id="preview-container">
            <div id="latex-preview">$$ \int (\dots) \, dx $$</div>
        </div>

        <label>función a integrar</label>
        <input id="funcion" placeholder="Ej: ln(x) + 2x" type="text" oninput="actualizarVistaPrevia()">

        <div class="row">
            <div>
                <label>tipo</label>
                <select id="tipo" onchange="toggleLimites(); actualizarVistaPrevia();">
                    <option value="indef">Indefinida</option>
                    <option value="def">Definida</option>
                </select>
            </div>
            <div>
                <label>variable</label>
                <select id="variable" onchange="actualizarVistaPrevia()">
                    <option value="x">dx</option>
                    <option value="t">dt</option>
                    <option value="u">du</option>
                </select>
            </div>
        </div>

        <div id="limites-container" class="row" style="display: none;">
            <div><label>límite inferior</label><input id="limA" placeholder="0" type="text" oninput="actualizarVistaPrevia()"></div>
            <div><label>límite superior</label><input id="limB" placeholder="pi" type="text" oninput="actualizarVistaPrevia()"></div>
        </div>

        <div class="botones-container">
            <button onclick="calcularIntegral()" class="btn-principal">Calcular Resultado</button>
            <button onclick="irAPasoAPaso()" class="btn-secundario">
                <img src="https://cdn-icons-png.flaticon.com/512/2374/2374367.png" width="20">
                Ver paso a paso
            </button>
        </div>

        <div id="resultado">Esperando función...</div>
    </div>
</div>

<script>
// Normalización de alta robustez
function robustez(expr) {
    if (!expr) return "";
    let e = expr.toLowerCase().trim();
    
    // Mapeo básico
    e = e.replace(/ln/g, 'log');
    e = e.replace(/π/g, 'pi');
    
    // Multiplicación implícita inteligente (evita romper nombres de funciones)
    // 1. Números seguidos de letras: 2x -> 2*x
    e = e.replace(/(\d)([a-z])/g, '$1*$2');
    // 2. Paréntesis cerrados seguidos de apertura: (x)(y) -> (x)*(y)
    e = e.replace(/\)\(/g, ')*(');
    // 3. Letras seguidas de log/sin/etc: xlog(x) -> x*log(x)
    e = e.replace(/([a-z])(log|sin|cos|tan|sqrt)/g, '$1*$2');
    
    return e;
}

function limpiarTex(tex) {
    // Forzamos visualmente el LN en lugar de LOG
    return tex.replace(/\\log/g, '\\ln').replace(/log/g, '\\ln');
}

function toggleLimites() {
    document.getElementById('limites-container').style.display = (document.getElementById('tipo').value === 'def') ? 'grid' : 'none';
}

function actualizarVistaPrevia() {
    const input = document.getElementById('funcion').value.trim();
    const v = document.getElementById('variable').value;
    const tipo = document.getElementById('tipo').value;
    const preview = document.getElementById('latex-preview');

    if (!input) {
        preview.innerHTML = tipo === 'indef' ? `$$ \\int (\\dots) \\, d${v} $$` : `$$ \\int_{a}^{b} (\\dots) \\, d${v} $$`;
        MathJax.typesetPromise([preview]);
        return;
    }

    try {
        const p = robustez(input);
        const texf = limpiarTex(Algebrite.run(`printlatex(${p})`));
        preview.innerHTML = (tipo === 'indef') ? `$$ \\int ${texf} \\, d${v} $$` : `$$ \\int_{a}^{b} ${texf} \\, d${v} $$`;
    } catch (e) { preview.innerHTML = `$$ \\dots $$`; }
    MathJax.typesetPromise([preview]);
}

function calcularIntegral() {
    const input = document.getElementById('funcion').value.trim();
    const v = document.getElementById('variable').value;
    const tipo = document.getElementById('tipo').value;
    const out = document.getElementById('resultado');
    
    if (!input) return;

    try {
        const f = robustez(input);
        
        if (tipo === 'indef') {
            const comando = `integral(${f}, ${v})`;
            const res = Algebrite.run(comando);
            
            // Verificamos si realmente se integró (si no contiene la palabra integral)
            if (res.includes('integral')) {
                out.innerHTML = "<div style='font-size:14px; color:#666; text-align:center;'>Integral compleja. Usa <b>'Ver paso a paso'</b> para MathDF.</div>";
            } else {
                const texRes = limpiarTex(Algebrite.run(`printlatex(${comando})`));
                out.innerHTML = `$$ ${texRes} + C $$`;
            }
        } else {
            const a = robustez(document.getElementById('limA').value);
            const b = robustez(document.getElementById('limB').value);
            const defRes = Algebrite.run(`defint(${f}, ${v}, ${a}, ${b})`);
            const texDef = limpiarTex(Algebrite.run(`printlatex(defint(${f}, ${v}, ${a}, ${b}))`));
            out.innerHTML = `$$ = ${texDef} $$`;
        }
    } catch (e) { 
        out.innerHTML = "<small style='color:#d93025'>Revisa los paréntesis o la expresión.</small>"; 
    }
    MathJax.typesetPromise([out]);
}

// REDIRECCIÓN A MATHDF RESTAURADA
function irAPasoAPaso() {
    const f = document.getElementById('funcion').value.trim();
    const v = document.getElementById('variable').value;
    if (f) {
        // Formato de URL de MathDF
        window.open(`https://mathdf.com/int/es/?expr=${encodeURIComponent(f)}&var=${v}`, '_blank');
    }
}

actualizarVistaPrevia();
</script>

</body>
</html>
