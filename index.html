<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Integrales</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/algebrite/1.4.0/algebrite.bundle-for-browser.min.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 20px; background-color: #f4f4f9; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #4285f4; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #357ae8; }
        #resultado { margin-top: 20px; font-weight: bold; color: #333; word-wrap: break-word; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Calculadora de Integrales</h2>
        <p>Introduce la función (ej. <code>x^2</code>):</p>
        <input type="text" id="funcion" placeholder="x^2">
        <button onclick="calcular()">Calcular Integral</button>
        <div id="resultado"></div>
    </div>

    <script>
        function calcular() {
            const input = document.getElementById('funcion').value;
            try {
                // Algebrite.integral() realiza la integración simbólica
                const resultado = Algebrite.integral(input).toString();
                document.getElementById('resultado').innerHTML = "Resultado: <br>∫ " + input + " dx = " + resultado + " + C";
            } catch (error) {
                document.getElementById('resultado').innerHTML = "Error: Revisa la expresión.";
            }
        }
    </script>
</body>
</html>
