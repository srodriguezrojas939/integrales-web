<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Integrales Pro</title>
    
    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/nerdamer.core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Algebra.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Calculus.js"></script>
    
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script" async></script>

    <style>
        :root { --primary: #2563eb; --secondary: #f59e0b; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg); display: flex; justify-content: center; padding: 20px; color: #1e293b; }
        .card { background: white; padding: 2rem; border-radius: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); width: 100%; max-width: 650px; border: 1px solid #e2e8f0; }
        h2 { color: var(--primary); text-align: center; margin-bottom: 1.5rem; font-weight: 800; }
        input { width: 100%; padding: 16px; border: 2px solid #e2e8f0; border-radius: 14px; font-size: 18px; box-sizing: border-box; transition: 0.3s; text-align: center; }
        input:focus { border-color: var(--primary); outline: none; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        button, .btn-link { padding: 16px; border: none; border-radius: 14px; font-size: 16px; cursor: pointer; font-weight: 700; transition: 0.2s; text-decoration: none; display: flex; align-items: center; justify-content: center; }
        .btn-calc { background: var(--primary); color: white; }
        .btn-steps { background: var(--secondary); color: white; display: none; }
        #resultado-box { margin-top: 25px; padding: 25px; border-radius: 18px; background: #ffffff; border: 2px solid #f1f5f9; min-height: 120px; overflow-x: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 1.3rem; }
    </style>
</head>
<body>

<div class="card">
    <h2>Calculadora de Integrales</h2>
    <input type="text" id="entrada" placeholder="Ej: ln(x+1) o sin(x)" onkeypress="if(event.key==='Enter') calcular()">
    
    <div class="btn-group">
        <button class="btn-calc" onclick="calcular()">Calcular</button>
        <a id="btnPasos" class="btn-link btn-steps" target="_blank">Paso a paso ↗</a>
    </div>
    
    <div id="resultado-box">
        <div id="salida">Esperando función...</div>
    </div>
</div>

<script>
    function limpiarLatex(tex) {
        // 1. Cambiar log por ln
        let clean = tex.replace(/\\log/g, '\\ln');
        
        // 2. Quitar paréntesis SOLO si dentro hay una sola letra (ej: ln(x) -> ln x)
        // Pero mantenerlos si hay algo más complejo (ej: ln(x+1))
        clean = clean.replace(/\\ln\\left\(([a-z0-9])\\right\)/g, '\\ln $1');
        clean = clean.replace(/\\sin\\left\(([a-z0-9])\\right\)/g, '\\sin $1');
        clean = clean.replace(/\\cos\\left\(([a-z0-9])\\right\)/g, '\\cos $1');
        clean = clean.replace(/\\tan\\left\(([a-z0-9])\\right\)/g, '\\tan $1');

        // 3. Quitar \left( y \right) genéricos pero con cuidado
        // Para este nivel, es mejor dejar que MathJax maneje la elegancia.
        return clean;
    }

    function calcular() {
        let inputRaw = document.getElementById('entrada').value.trim();
        const salida = document.getElementById('salida');
        const btnPasos = document.getElementById('btnPasos');

        if (!inputRaw) return;

        // CORRECCIÓN CLAVE: Convertir 'ln' a 'log' para que Nerdamer lo entienda como función
        let inputProcesado = inputRaw.replace(/ln/g, 'log');

        salida.innerHTML = "Procesando...";

        setTimeout(() => {
            try {
                // Calcular
                let integral = nerdamer('integrate(' + inputProcesado + ', x)');
                
                // Formatear LaTeX
                let resLatex = limpiarLatex(integral.toTeX());
                let entLatex = limpiarLatex(nerdamer(inputProcesado).toTeX());

                salida.innerHTML = `$$ \\int {${entLatex}} \\, dx = ${resLatex} + C $$`;
                MathJax.typesetPromise([salida]);

                // Enlace a MathDF (usamos la entrada original del usuario)
                btnPasos.href = "https://mathdf.com/int/es/#expr=" + encodeURIComponent(inputRaw);
                btnPasos.style.display = "flex";

            } catch (e) {
                salida.innerHTML = "<span style='color:red;'>Error: Revisa la expresión</span>";
                btnPasos.style.display = "none";
            }
        }, 100);
    }
</script>

</body>
</html>
