<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculadora de Integrales</title>

    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/nerdamer.core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Algebra.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Calculus.js"></script>
    
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$']] },
            options: { enableMenu: false }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap');

        body { 
            background: white; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            min-height: 100vh; 
            margin: 0; 
            padding: 10px; 
            box-sizing: border-box;
        }

        .fade-in { 
            opacity: 0; 
            transform: translateY(20px); 
            animation: fadeUp 0.8s ease forwards; 
            width: 100%; 
            max-width: 600px; 
        }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

        .calculadora {
            background: #F2F2F2; 
            padding: 30px 20px; 
            border-radius: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            box-sizing: border-box; 
            width: 100%;
        }

        .header-section { text-align: center; margin-bottom: 20px; }
        .header-section h1 { 
            font-family: 'Playfair Display', serif; 
            font-size: 32px; 
            margin: 0; 
            font-weight: 600; 
            text-transform: lowercase;
        }
        .header-section p { 
            font-family: 'Playfair Display', serif; 
            font-size: 18px; 
            margin: 5px 0; 
            font-weight: 600;
        }

        #preview-container, #resultado {
            background: white; 
            margin-bottom: 20px; 
            padding: 20px;
            border-radius: 20px; 
            min-height: 70px; 
            display: flex;
            align-items: center; 
            justify-content: center; 
            border: 1px solid #eee;
            overflow-x: auto; 
            -webkit-overflow-scrolling: touch;
        }

        label { 
            display: block; 
            font-family: 'Open Sans', sans-serif;
            font-size: 14px; 
            color: #444; 
            margin: 0 0 6px 12px; 
            font-weight: 600; 
        }
        
        input, select {
            width: 100%; 
            padding: 14px 18px; 
            margin-bottom: 15px; 
            border-radius: 25px;
            border: 1px solid #ccc; 
            box-sizing: border-box; 
            font-size: 16px; 
            outline: none;
            font-family: 'Open Sans', sans-serif;
            background-color: white;
        }

        .row { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
        }

        .botones-container { display: flex; flex-direction: column; gap: 12px; }

        .btn-principal {
            width: 100%; 
            background: black; 
            color: white; 
            border: none;
            padding: 18px; 
            border-radius: 30px; 
            font-size: 16px; 
            cursor: pointer;
            font-family: 'Open Sans', sans-serif; 
            font-weight: 700;
        }

        .btn-secundario {
            width: 100%; 
            background: white; 
            color: #333; 
            border: 1px solid #ccc;
            padding: 15px; 
            border-radius: 30px; 
            font-size: 14px; 
            cursor: pointer;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px;
            font-family: 'Open Sans', sans-serif;
        }

        @media (max-width: 450px) {
            .header-section h1 { font-size: 28px; }
            .row { grid-template-columns: 1fr; gap: 0; }
        }
    </style>
</head>
<body>

<div class="fade-in">
    <div class="calculadora">
        <div class="header-section">
            <h1>calculadora de integrales</h1>
            <p>√(Raiz) Cuadrada²</p>
        </div>

        <div id="preview-container">
            <div id="latex-preview">$$ \int (\dots) \, dx $$</div>
        </div>

        <label>función a integrar</label>
        <input id="funcion" placeholder="Ej: x^2 + cos(x)" type="text" oninput="actualizarVistaPrevia()">

        <div class="row">
            <div>
                <label>tipo</label>
                <select id="tipo" onchange="toggleLimites(); actualizarVistaPrevia();">
                    <option value="indef">Indefinida</option>
                    <option value="def">Definida</option>
                </select>
            </div>
            <div>
                <label>variable</label>
                <select id="variable" onchange="actualizarVistaPrevia()">
                    <option value="x">dx</option>
                    <option value="t">dt</option>
                    <option value="u">du</option>
                </select>
            </div>
        </div>

        <div id="limites-container" class="row" style="display: none;">
            <div>
                <label>límite inferior (a)</label>
                <input id="limA" placeholder="0" type="text" oninput="actualizarVistaPrevia()">
            </div>
            <div>
                <label>límite superior (b)</label>
                <input id="limB" placeholder="pi" type="text" oninput="actualizarVistaPrevia()">
            </div>
        </div>

        <div class="botones-container">
            <button onclick="calcularIntegral()" class="btn-principal">
                Calcular Resultado
            </button>

            <button onclick="irAPasoAPaso()" class="btn-secundario">
                <img src="https://cdn-icons-png.flaticon.com/512/2374/2374367.png" width="20">
                Ver paso a paso
            </button>
        </div>

        <div id="resultado">Esperando función...</div>
    </div>
</div>

<script>
function normalizar(expr) {
    if (!expr) return "";
    let e = expr.toLowerCase().replace(/\s+/g, '');
    e = e.replace(/π/g, 'pi');
    e = e.replace(/ln/g, 'log');
    return e;
}

function toggleLimites() {
    const tipo = document.getElementById('tipo').value;
    document.getElementById('limites-container').style.display = (tipo === 'def') ? 'grid' : 'none';
}

function actualizarVistaPrevia() {
    const input = document.getElementById('funcion').value.trim();
    const v = document.getElementById('variable').value;
    const tipo = document.getElementById('tipo').value;
    const preview = document.getElementById('latex-preview');

    if (!input) {
        preview.innerHTML = tipo === 'indef' ? `$$ \\int (\\dots) \\, d${v} $$` : `$$ \\int_{a}^{b} (\\dots) \\, d${v} $$`;
        MathJax.typesetPromise([preview]);
        return;
    }

    try {
        const fLatex = nerdamer(normalizar(input)).toTeX();
        if (tipo === 'indef') {
            preview.innerHTML = `$$ \\int ${fLatex} \\, d${v} $$`;
        } else {
            const a = document.getElementById('limA').value || 'a';
            const b = document.getElementById('limB').value || 'b';
            const aTex = a !== 'a' ? nerdamer(normalizar(a)).toTeX() : 'a';
            const bTex = b !== 'b' ? nerdamer(normalizar(b)).toTeX() : 'b';
            preview.innerHTML = `$$ \\int_{${aTex}}^{${bTex}} ${fLatex} \\, d${v} $$`;
        }
    } catch (e) { preview.innerHTML = `$$ \\dots $$`; }
    MathJax.typesetPromise([preview]);
}

function calcularIntegral() {
    const input = document.getElementById('funcion').value.trim();
    const v = document.getElementById('variable').value;
    const tipo = document.getElementById('tipo').value;
    const out = document.getElementById('resultado');
    
    if (!input) return;

    try {
        const f = normalizar(input);
        
        if (tipo === 'indef') {
            // Intentamos simplificar antes e integrar
            let F = nerdamer.integrate(f, v);
            let resText = F.text();

            // Si la respuesta contiene "integrate", Nerdamer no pudo resolverla
            if (resText.includes('integrate')) {
                out.innerHTML = "<div style='font-size:14px; color:#555;'>Esta integral requiere métodos avanzados. Usa el botón <b>'Ver paso a paso'</b> para la solución completa.</div>";
            } else {
                // Intentamos expandir para limpiar partes no resueltas de integración por partes
                let finalRes = nerdamer(resText).expand();
                out.innerHTML = `$$ ${finalRes.toTeX()} + C $$`;
            }
        } else {
            const valA = document.getElementById('limA').value.trim();
            const valB = document.getElementById('limB').value.trim();
            if (!valA || !valB) { out.innerHTML = "<small>Faltan límites</small>"; return; }
            const resDef = nerdamer(`defint(${f}, ${normalizar(valA)}, ${normalizar(valB)}, ${v})`);
            out.innerHTML = `$$ = ${resDef.toTeX()} $$`;
        }
        MathJax.typesetPromise([out]);
    } catch (e) { 
        out.innerHTML = "<small style='color:red'>Error: Revisa los paréntesis o la sintaxis</small>"; 
    }
}

function irAPasoAPaso() {
    const f = document.getElementById('funcion').value.trim();
    const v = document.getElementById('variable').value;
    if (f) window.open(`https://mathdf.com/int/es/?expr=${encodeURIComponent(f)}&v=${v}`, '_blank');
}

actualizarVistaPrevia();
</script>

</body>
</html>
