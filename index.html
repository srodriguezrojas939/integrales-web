<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Integrales Pro</title>

    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/nerdamer.core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Algebra.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Calculus.js"></script>

    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$']] }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 24px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        h2 { color: #1e293b; text-align: center; margin-bottom: 1.5rem; }
        input, select, button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 20px;
        }
        button:hover { background: #1d4ed8; }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        #resultado {
            margin-top: 30px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 12px;
            min-height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            overflow-x: auto;
        }
    </style>
</head>

<body>
<div class="card">
    <h2>Calculadora de Integrales</h2>

    <input id="funcion" placeholder="Ej: x^2, sin(x), cos(x)*tan(x)">

    <div class="row">
        <select id="tipo">
            <option value="indef">Integral indefinida</option>
            <option value="def">Integral definida</option>
        </select>
        <select id="variable">
            <option value="x">dx</option>
            <option value="t">dt</option>
            <option value="u">du</option>
        </select>
    </div>

    <div class="row" id="limites" style="display:none;">
        <input id="a" placeholder="Límite inferior (a)">
        <input id="b" placeholder="Límite superior (b)">
    </div>

    <button onclick="calcular()">Calcular Resultado</button>

    <div id="resultado">Esperando función...</div>
</div>

<script>
// Normaliza la entrada para que Nerdamer la entienda mejor
function normalizar(expr) {
    if (!expr) return "";
    let e = expr.toLowerCase().replace(/\s+/g, '');
    e = e.replace(/π/g, 'pi');
    e = e.replace(/ln/g, 'log');
    // Intenta poner paréntesis a funciones si el usuario lo olvida
    e = e.replace(/(sin|cos|tan|sec|csc|cot|log)(\d*[a-z])/g, '$1($2)');
    return e;
}

function calcular() {
    const funcionInput = document.getElementById('funcion').value.trim();
    const tipo = document.getElementById('tipo').value;
    const v = document.getElementById('variable').value;
    const out = document.getElementById('resultado');

    if (!funcionInput) {
        out.innerHTML = "Por favor, ingresa una función.";
        return;
    }

    try {
        const f = normalizar(funcionInput);
        let latex = "";

        if (tipo === 'indef') {
            // Integral Indefinida
            const F = nerdamer.integrate(f, v);
            latex = `\\int ${nerdamer(f).toTeX()}\\, d${v} = ${F.toTeX()} + C`;
        } else {
            // Integral Definida
            const valA = document.getElementById('a').value.trim();
            const valB = document.getElementById('b').value.trim();

            if (valA === "" || valB === "") {
                out.innerHTML = "<span style='color:red'>Debes indicar ambos límites.</span>";
                return;
            }

            const a = normalizar(valA);
            const b = normalizar(valB);

            // Uso de la función nativa defint de Nerdamer
            const resultadoDef = nerdamer(`defint(${f}, ${a}, ${b}, ${v})`);
            
            // Construcción del LaTeX para el resultado
            const aTeX = nerdamer(a).toTeX();
            const bTeX = nerdamer(b).toTeX();
            latex = `\\int_{${aTeX}}^{${bTeX}} ${nerdamer(f).toTeX()}\\, d${v} = ${resultadoDef.toTeX()}`;
        }

        out.innerHTML = `$$${latex}$$`;
        MathJax.typesetPromise([out]);

    } catch (error) {
        console.error(error);
        out.innerHTML = "<span style='color:red'>Error: Revisa la sintaxis (ej. usa x^2 en vez de x2)</span>";
    }
}

// Mostrar/Ocultar campos de límites
document.getElementById('tipo').addEventListener('change', e => {
    document.getElementById('limites').style.display = (e.target.value === 'def') ? 'grid' : 'none';
});
</script>

</body>
</html>
