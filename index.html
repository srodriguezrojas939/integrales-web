<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora Pro de Integrales</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/algebrite/1.4.0/algebrite.bundle-for-browser.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; padding: 20px; background-color: #eef2f7; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { color: #1a73e8; text-align: center; margin-top: 0; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; transition: border-color 0.3s; box-sizing: border-box;}
        input:focus { border-color: #1a73e8; }
        button { width: 100%; padding: 12px; background-color: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #1557b0; }
        #resultado { margin-top: 25px; padding: 15px; border-radius: 8px; background-color: #f8f9fa; border-left: 5px solid #1a73e8; min-height: 50px; word-wrap: break-word; }
        .guia { font-size: 0.85rem; color: #666; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Calculadora de Integrales</h2>
        <input type="text" id="funcion" placeholder="Ejemplo: 3x^2 + cos(x)">
        <button onclick="calcular()">Calcular Integral</button>
        
        <div id="resultado">El resultado aparecerá aquí...</div>

        <div class="guia">
            <strong>Guía rápida:</strong>
            <ul style="padding-left: 20px;">
                <li>Usa <code>*</code> para multiplicar: <code>2*x</code> en vez de <code>2x</code></li>
                <li>Potencias: <code>x^2</code></li>
                <li>Raíz cuadrada: <code>sqrt(x)</code></li>
                <li>Funciones: <code>sin(x), cos(x), exp(x), log(x)</code></li>
            </ul>
        </div>
    </div>

    <script>
        function calcular() {
            let input = document.getElementById('funcion').value.toLowerCase();
            const cajaResultado = document.getElementById('resultado');

            if (!input.trim()) {
                cajaResultado.innerHTML = "⚠️ Por favor, escribe una función.";
                return;
            }

            try {
                // Pre-procesamiento para evitar errores comunes
                let procesado = input
                    .replace(/(\d)([a-z])/g, '$1*$2') // Convierte 2x en 2*x
                    .replace(/sen/g, 'sin')           // Convierte sen en sin
                    .replace(/tg/g, 'tan');           // Convierte tg en tan

                const resultado = Algebrite.integral(procesado).toString();
                
                if (resultado === "0" && input !== "0") {
                    throw new Error("No se pudo integrar");
                }

                cajaResultado.innerHTML = `<strong>Resultado:</strong><br> ∫ (${input}) dx = <br><br> <code style="color:#d93025; font-size:1.2rem;">${resultado} + C</code>`;
            } catch (error) {
                cajaResultado.innerHTML = "❌ <strong>Error:</strong> No pude entender la expresión. Asegúrate de usar <code>*</code> para multiplicar (ej: 5*x).";
            }
        }
    </script>
</body>
</html>
