<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Integrales Pro</title>
    
    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/nerdamer.core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Algebra.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Calculus.js"></script>
    
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            startup: {
                pageReady: () => {
                    return MathJax.startup.defaultPageReady();
                }
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script" async></script>

    <style>
        :root { --primary: #2563eb; --secondary: #f59e0b; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 2rem; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 650px; border: 1px solid #e2e8f0; }
        h2 { color: var(--primary); text-align: center; margin-bottom: 1.5rem; }
        input { width: 100%; padding: 16px; border: 2px solid #e2e8f0; border-radius: 14px; font-size: 18px; box-sizing: border-box; text-align: center; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        button, .btn-link { padding: 16px; border: none; border-radius: 14px; font-size: 16px; cursor: pointer; font-weight: 700; transition: 0.2s; text-decoration: none; display: flex; align-items: center; justify-content: center; }
        .btn-calc { background: var(--primary); color: white; }
        .btn-steps { background: var(--secondary); color: white; display: none; }
        #resultado-box { margin-top: 25px; padding: 20px; border-radius: 18px; background: #fff; border: 1px solid #e2e8f0; min-height: 100px; overflow-x: auto; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; }
        .error { color: #ef4444; font-weight: 600; }
    </style>
</head>
<body>

<div class="card">
    <h2>Calculadora de Integrales</h2>
    <input type="text" id="entrada" placeholder="Ej: ln(x+1) o sin(x)" onkeypress="if(event.key==='Enter') calcular()">
    
    <div class="btn-group">
        <button class="btn-calc" onclick="calcular()">Calcular</button>
        <a id="btnPasos" class="btn-link btn-steps" target="_blank">Paso a paso ↗</a>
    </div>
    
    <div id="resultado-box">
        <div id="salida">Esperando función...</div>
    </div>
</div>

<script>
    // Configuramos Nerdamer para que entienda 'ln' como 'log'
    nerdamer.setFunction('ln', ['x'], 'log(x)');

    function limpiarLatex(tex) {
        if (!tex) return "";
        let clean = tex.replace(/\\log/g, '\\ln');
        // Quitar paréntesis solo si es una variable única (ej: ln x)
        clean = clean.replace(/\\ln\\left\(([a-z0-9])\\right\)/g, '\\ln $1');
        clean = clean.replace(/\\sin\\left\(([a-z0-9])\\right\)/g, '\\sin $1');
        clean = clean.replace(/\\cos\\left\(([a-z0-9])\\right\)/g, '\\cos $1');
        return clean;
    }

    function calcular() {
        const inputRaw = document.getElementById('entrada').value.trim();
        const salida = document.getElementById('salida');
        const btnPasos = document.getElementById('btnPasos');

        if (!inputRaw) return;
        salida.innerHTML = "Procesando...";

        setTimeout(() => {
            try {
                // 1. Resolvemos la integral
                let integral = nerdamer('integrate(' + inputRaw + ', x)');
                
                // 2. Obtenemos LaTeX
                let resTex = limpiarLatex(integral.toTeX());
                let entTex = limpiarLatex(nerdamer(inputRaw).toTeX());

                // 3. Insertamos en el DOM con delimitadores estándar
                salida.innerHTML = `\\[ \\int {${entTex}} \\, dx = ${resTex} + C \\]`;
                
                // 4. FORZAR RENDERIZADO (Este paso evita que se vea el código crudo)
                if (window.MathJax && MathJax.typesetPromise) {
                    MathJax.typesetPromise([salida]).catch((err) => console.log(err));
                }

                // 5. Botón de pasos
                btnPasos.href = "https://mathdf.com/int/es/#expr=" + encodeURIComponent(inputRaw);
                btnPasos.style.display = "flex";

            } catch (e) {
                salida.innerHTML = "<span class='error'>❌ Error: No se pudo procesar. Revisa los paréntesis.</span>";
                btnPasos.style.display = "none";
            }
        }, 100);
    }
</script>

</body>
</html>
