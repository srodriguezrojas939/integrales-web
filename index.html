<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Integrales Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/algebrite@1.4.0/dist/algebrite.bundle-for-browser.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; display: flex; justify-content: center; padding: 20px; background-color: #f0f2f5; }
        .card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { color: #1a73e8; text-align: center; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #dfe1e5; border-radius: 10px; font-size: 16px; box-sizing: border-box; transition: 0.3s; }
        input:focus { border-color: #1a73e8; outline: none; box-shadow: 0 0 8px rgba(26,115,232,0.2); }
        button { width: 100%; padding: 12px; background-color: #1a73e8; color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; font-weight: 600; margin-top: 10px; }
        button:hover { background-color: #1557b0; }
        #resultado { margin-top: 20px; padding: 15px; border-radius: 10px; background-color: #f8f9fa; border-left: 5px solid #1a73e8; min-height: 40px; font-size: 1.1rem; }
        .instrucciones { font-size: 0.85rem; color: #5f6368; margin-top: 20px; line-height: 1.5; }
        code { background: #eee; padding: 2px 4px; border-radius: 4px; font-family: monospace; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Calculadora de Integrales</h2>
        <input type="text" id="funcion" placeholder="Ejemplo: 5*x + sin(x)" onkeypress="if(event.key==='Enter') calcular()">
        <button onclick="calcular()">Calcular Integral</button>
        
        <div id="resultado">Escribe una función y presiona el botón.</div>

        <div class="instrucciones">
            <strong>Consejos:</strong><br>
            • Usa <code>*</code>: <code>5*x</code> en lugar de <code>5x</code><br>
            • Potencias: <code>x^2</code><br>
            • Seno: <code>sin(x)</code>, Coseno: <code>cos(x)</code><br>
            • Logaritmo: <code>log(x)</code>
        </div>
    </div>

    <script>
        function calcular() {
            const inputElement = document.getElementById('funcion');
            const resElement = document.getElementById('resultado');
            let texto = inputElement.value.trim();

            if (!texto) {
                resElement.innerHTML = "⚠️ Por favor, escribe algo.";
                return;
            }

            // Verificar si la librería cargó
            if (typeof Algebrite === 'undefined') {
                resElement.innerHTML = "❌ Error técnico: La librería matemática no cargó. Revisa tu conexión a internet.";
                return;
            }

            try {
                // Limpieza básica automática
                let procesado = texto.toLowerCase()
                    .replace(/sen/g, 'sin')
                    .replace(/tg/g, 'tan');

                // Cálculo
                let resultado = Algebrite.integral(procesado).toString();

                // Si el resultado es igual al input, Algebrite no pudo resolverlo simbólicamente
                if (resultado === procesado) {
                    resElement.innerHTML = "❌ No se pudo encontrar una integral simple para esta expresión.";
                } else {
                    resElement.innerHTML = `<strong>Resultado:</strong><br><div style="margin-top:10px; color:#1a73e8; font-family:serif; font-size:1.3rem;">∫ (${texto}) dx = <br><b>${resultado} + C</b></div>`;
                }
            } catch (e) {
                resElement.innerHTML = "❌ <strong>Error de sintaxis:</strong> Asegúrate de usar <code>*</code> para multiplicar y cerrar todos los paréntesis.";
            }
        }
    </script>
</body>
</html>
