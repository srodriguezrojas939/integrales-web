<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculadora de Integrales Pro</title>

    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/nerdamer.core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Algebra.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Calculus.js"></script>
    
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$']] },
            options: { enableMenu: false }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap');

        body { background: white; display: flex; justify-content: center; padding: 20px; font-family: 'Open Sans', sans-serif; }
        .calculadora { background: #F2F2F2; padding: 30px; border-radius: 35px; width: 100%; max-width: 600px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }

        .header-section { text-align: center; margin-bottom: 20px; }
        .header-section h1 { font-family: 'Playfair Display', serif; font-size: 32px; margin: 0; text-transform: lowercase; }

        #preview-container, #resultado {
            background: white; padding: 20px; border-radius: 20px; min-height: 70px; 
            display: flex; align-items: center; justify-content: center; border: 1px solid #eee; overflow-x: auto;
        }

        /* Espaciado de 30px solicitado */
        #resultado { margin-top: 30px; margin-bottom: 30px; }

        label { display: block; font-size: 14px; color: #444; margin: 0 0 6px 12px; font-weight: 600; }
        input, select { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 25px; border: 1px solid #ccc; font-size: 16px; outline: none; background: white; }

        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn-principal { width: 100%; background: black; color: white; border: none; padding: 18px; border-radius: 30px; font-weight: 700; cursor: pointer; margin-bottom: 10px; }
        .btn-secundario { width: 100%; background: white; border: 1px solid #ccc; padding: 15px; border-radius: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }

        /* Estilo de Píldoras */
        .pills-nav { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .pill { background: #e0e0e0; border: none; padding: 8px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; transition: 0.3s; font-weight: 600; color: #555; }
        .pill.active { background: white; color: black; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* Panel de Símbolos Estética Imagen */
        .symbols-container { background: white; border-radius: 20px; padding: 15px; margin-top: 15px; border: 1px solid #ddd; display: none; }
        .symbols-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 10px; }
        .sym-btn { 
            background: white; border: 1px solid #efefef; padding: 15px 5px; border-radius: 12px; 
            text-align: center; cursor: pointer; transition: 0.2s; font-size: 14px; color: #333;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .sym-btn:hover { background: #f8f8f8; border-color: #ccc; }
        .sym-btn span { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
        .sym-btn small { font-size: 9px; text-transform: uppercase; color: #888; font-weight: 700; }
    </style>
</head>
<body>

<div class="calculadora">
    <div class="header-section">
        <h1>calculadora de integrales</h1>
        <p>√(Raiz) Cuadrada²</p>
    </div>

    <div id="preview-container"><div id="latex-preview">$$ \int (\dots) \, dx $$</div></div>

    <label>función a integrar</label>
    <input id="funcion" placeholder="Ej: x^2 + cos(x)" type="text" oninput="actualizarVistaPrevia()">

    <div class="row">
        <div><label>tipo</label><select id="tipo" onchange="toggleLimites(); actualizarVistaPrevia();"><option value="indef">Indefinida</option><option value="def">Definida</option></select></div>
        <div><label>variable</label><select id="variable" onchange="actualizarVistaPrevia()"><option value="x">dx</option><option value="t">dt</option></select></div>
    </div>

    <div id="limites-container" class="row" style="display: none;">
        <div><label>inferior (a)</label><input id="limA" placeholder="0" type="text" oninput="actualizarVistaPrevia()"></div>
        <div><label>superior (b)</label><input id="limB" placeholder="pi" type="text" oninput="actualizarVistaPrevia()"></div>
    </div>

    <button onclick="calcularIntegral()" class="btn-principal">Calcular Resultado</button>
    <button onclick="irAPasoAPaso()" class="btn-secundario"><img src="https://cdn-icons-png.flaticon.com/512/2374/2374367.png" width="20">Ver paso a paso</button>

    <div id="resultado">Esperando función...</div>

    <div class="pills-nav" id="pillsNav">
        <button class="pill active" onclick="showCategory('principales', this)">Principales</button>
        <button class="pill" onclick="showCategory('trig', this)">Trigonométricas</button>
        <button class="pill" onclick="showCategory('inv', this)">Inversas</button>
        <button class="pill" onclick="showCategory('log', this)">Logarítmicas</button>
    </div>

    <div id="symbolsPanel" class="symbols-container" style="display: block;">
        <div id="grid-content" class="symbols-grid"></div>
    </div>
</div>

<script>
const categorias = {
      principales: [
        { s: '(', t: 'ABRIR (' }, 
        { s: ')', t: 'CERRAR )' },
        { s: '+', t: 'SUMA' }, 
        { s: '-', t: 'RESTA' },
        { s: '*', t: 'MULT.' }, 
        { s: '/', t: 'DIV.' },
        { s: '( )/( )', t: 'FRACCIÓN' }, 
        { s: '^', t: 'POTENCIA' },
        { s: 'sqrt()', t: 'RAÍZ (√)' }, 
        { s: '^(1/ )', t: 'RAÍZ N' },
        { s: 'x', t: 'VAR X' }, 
        { s: 'y', t: 'VAR Y' },
        { s: 'pi', t: 'PI' }, 
        { s: 'e', t: 'EULER' },
        { s: 'inf', t: 'INFINITO' }, 
        { s: '-inf', t: '- INFINITO' },
        { s: 'abs()', t: 'ABS.' }, 
        { s: '!', t: 'FACT.' }
    ],
    trig: [
       { s: 'sin()', t: 'SENO' }, 
        { s: 'cos()', t: 'COSENO' }, 
        { s: 'tan()', t: 'TAN' }, 
        { s: 'sec()', t: 'SEC' }, 
        { s: 'csc()', t: 'CSC' }, 
        { s: 'cot()', t: 'COT' },
        { s: 'sinh()', t: 'SENH' }, 
        { s: 'cosh()', t: 'COSH' }, 
        { s: 'tanh()', t: 'TANH' },
        { s: 'coth()', t: 'COTH' }, 
        { s: 'sech()', t: 'SECH' }, 
        { s: 'csch()', t: 'CSCH' }
    ],
    inv: [
    { s: 'asin()', t: 'ARCSIN' }, 
        { s: 'acos()', t: 'ARCCOS' }, 
        { s: 'atan()', t: 'ARCTAN' },
          { s: 'asec()', t: 'ARCSEC' }, 
        { s: 'acsc()', t: 'ARCCSC' },
        { s: 'asinh()', t: 'ARSINH' }, 
        { s: 'acosh()', t: 'ARCOSH' }, 
        { s: 'atanh()', t: 'ARTANH' },
        { s: 'acoth()', t: 'ARCOTH' },
        { s: 'asech()', t: 'ARSECH' }, 
        { s: 'acsch()', t: 'ARCSCH' }
    ],
    log: [
        { s: 'log()', t: 'LN' }, { s: 'ln()', t: 'LN' }, { s: 'exp()', t: 'EXP' }, { s: 'e^', t: 'E base' }, { s: 'NOTA:', t: 'En los resultados, log representa el logaritmo natural (ln).' }
    ]
};

function showCategory(cat, btn) {
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    const grid = document.getElementById('grid-content');
    grid.innerHTML = '';
    categorias[cat].forEach(item => {
        const div = document.createElement('div');
        div.className = 'sym-btn';
        div.innerHTML = `<span>${item.s}</span><small>${item.t}</small>`;
        div.onclick = () => insertarSimbolo(item.s);
        grid.appendChild(div);
    });
}

function insertarSimbolo(s) {
    const input = document.getElementById('funcion');
    const pos = input.selectionStart;
    const texto = input.value;
    input.value = texto.slice(0, pos) + s + texto.slice(pos);
    input.focus();
    if(s.includes('()')) input.setSelectionRange(pos + s.length - 1, pos + s.length - 1);
    actualizarVistaPrevia();
}

// Lógica de cálculo (Nerdamer corregido)
function normalizar(expr) { return expr.toLowerCase().replace(/π/g, 'pi').replace(/ln/g, 'log'); }

function actualizarVistaPrevia() {
    const input = document.getElementById('funcion').value.trim();
    const v = document.getElementById('variable').value;
    const preview = document.getElementById('latex-preview');
    if (!input) { preview.innerHTML = `$$ \\int (\\dots) \\, d${v} $$`; MathJax.typesetPromise([preview]); return; }
    try {
        const fTex = nerdamer(normalizar(input)).toTeX();
        preview.innerHTML = `$$ \\int ${fTex} \\, d${v} $$`;
    } catch (e) { preview.innerHTML = `$$ \\dots $$`; }
    MathJax.typesetPromise([preview]);
}

function calcularIntegral() {
    const input = document.getElementById('funcion').value.trim();
    const out = document.getElementById('resultado');
    if (!input) return;
    try {
        const f = normalizar(input);
        const v = document.getElementById('variable').value;
        const tipo = document.getElementById('tipo').value;
        if (tipo === 'indef') {
            let sol = nerdamer.integrate(f, v);
            out.innerHTML = sol.toString().includes('integrate') ? "Usa 'Ver paso a paso'" : `$$ ${sol.toTeX()} + C $$`;
        } else {
            const resDef = nerdamer.defint(f, normalizar(document.getElementById('limA').value), normalizar(document.getElementById('limB').value), v);
            out.innerHTML = `$$ = ${resDef.toTeX()} $$`;
        }
        MathJax.typesetPromise([out]);
    } catch (e) { out.innerHTML = "<small style='color:red'>Error de sintaxis</small>"; }
}

function toggleLimites() { document.getElementById('limites-container').style.display = (document.getElementById('tipo').value === 'def') ? 'grid' : 'none'; }
function irAPasoAPaso() { const f = document.getElementById('funcion').value; if(f) window.open(`https://mathdf.com/int/es/?expr=${encodeURIComponent(f)}`, '_blank'); }

showCategory('principales', document.querySelector('.pill'));
actualizarVistaPrevia();
</script>

</body>
</html>
