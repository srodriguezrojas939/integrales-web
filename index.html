<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Integrales Pro</title>
    
    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/nerdamer.core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Algebra.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Calculus.js"></script>
    
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script" async></script>

    <style>
        :root { --primary: #2563eb; --secondary: #f59e0b; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg); display: flex; justify-content: center; padding: 20px; color: #1e293b; }
        .card { background: white; padding: 2rem; border-radius: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); width: 100%; max-width: 700px; border: 1px solid #e2e8f0; }
        h2 { color: var(--primary); text-align: center; margin-bottom: 1.5rem; font-weight: 800; }
        input { width: 100%; padding: 16px; border: 2px solid #e2e8f0; border-radius: 14px; font-size: 18px; box-sizing: border-box; transition: 0.3s; text-align: center; outline: none; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        button, .btn-link { padding: 16px; border: none; border-radius: 14px; font-size: 16px; cursor: pointer; font-weight: 700; transition: 0.2s; text-decoration: none; display: flex; align-items: center; justify-content: center; }
        .btn-calc { background: var(--primary); color: white; }
        .btn-steps { background: var(--secondary); color: white; display: none; }
        #resultado-box { margin-top: 25px; padding: 25px; border-radius: 18px; background: #ffffff; border: 1px solid #e2e8f0; min-height: 120px; overflow-x: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 1.4rem; }
        .footer-info { font-size: 0.85rem; color: #64748b; margin-top: 20px; text-align: center; line-height: 1.4; }
    </style>
</head>
<body>

<div class="card">
    <h2>Calculadora de Integrales</h2>
    <input type="text" id="entrada" placeholder="Ej: sen(8x+1) o log(x)" onkeypress="if(event.key==='Enter') calcular()">
    
    <div class="btn-group">
        <button class="btn-calc" onclick="calcular()">Calcular</button>
        <a id="btnPasos" class="btn-link btn-steps" target="_blank">Paso a paso ↗</a>
    </div>
    
    <div id="resultado-box"><div id="salida">Resultado...</div></div>

    <div class="footer-info">Escribe <b>sen</b> para seno y <b>log</b> para logaritmo natural.</div>
</div>

<script>
    // 1. TRADUCTOR DE ENTRADA (Español/Humano -> Nerdamer)
    function procesarEntrada(texto) {
        return texto.toLowerCase()
            .replace(/sen/g, 'sin')      // Traduce sen a sin
            .replace(/ln/g, 'log')       // Nerdamer usa log como natural
            .replace(/tg/g, 'tan');      // Traduce tg a tan
    }

    // 2. EMBELLECEDOR DE LATEX (Estilo MathDF)
    function limpiarLatex(tex) {
        if (!tex) return "";
        return tex
            .replace(/\\log/g, '\\ln')              // Siempre mostrar ln
            .replace(/\\cdot/g, '')                 // Quitar puntos de multiplicación
            // Quitar paréntesis en argumentos simples: sin(8x), ln(x), etc.
            // Busca funciones seguidas de paréntesis con contenido simple (letras, números, espacios)
            .replace(/\\(sin|cos|tan|ln|sqrt)\\left\(([a-z0-9\s]+)\\right\)/g, '\\$1 $2')
            // Caso especial para raíces: \sqrt x en lugar de \sqrt(x)
            .replace(/\\sqrt\{([a-z0-9\s]+)\}/g, '\\sqrt $1');
    }

    function calcular() {
        const inputUser = document.getElementById('entrada').value.trim();
        const salida = document.getElementById('salida');
        const btnPasos = document.getElementById('btnPasos');

        if (!inputUser) return;
        salida.innerHTML = "Procesando...";

        const inputMotor = procesarEntrada(inputUser);

        setTimeout(() => {
            try {
                // Cálculo
                let integral = nerdamer('integrate(' + inputMotor + ', x)');
                
                // Formateo de visualización
                let resTex = limpiarLatex(integral.toTeX());
                let entTex = limpiarLatex(nerdamer(inputMotor).toTeX());

                salida.innerHTML = `\\[ \\int {${entTex}} \\, dx = ${resTex} + C \\]`;
                MathJax.typesetPromise([salida]);

                // Enlace MathDF (usamos la entrada original del usuario)
                btnPasos.href = "https://mathdf.com/int/es/#expr=" + encodeURIComponent(inputUser);
                btnPasos.style.display = "flex";

            } catch (e) {
                salida.innerHTML = "<span style='color:red;'>Error de sintaxis</span>";
                btnPasos.style.display = "none";
            }
        }, 100);
    }
</script>
</body>
</html>
