<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Integrales Estilo MathDF</title>
    
    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/nerdamer.core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Algebra.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Calculus.js"></script>
    
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script" async></script>

    <style>
        :root { --primary: #2563eb; --secondary: #f59e0b; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg); display: flex; justify-content: center; padding: 20px; color: #1e293b; }
        .card { background: white; padding: 2rem; border-radius: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); width: 100%; max-width: 650px; border: 1px solid #e2e8f0; }
        h2 { color: var(--primary); text-align: center; margin-bottom: 1.5rem; font-weight: 800; }
        
        .input-area { margin-bottom: 20px; }
        input { width: 100%; padding: 16px; border: 2px solid #e2e8f0; border-radius: 14px; font-size: 18px; box-sizing: border-box; transition: 0.3s; text-align: center; outline: none; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
        
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        button, .btn-link { padding: 16px; border: none; border-radius: 14px; font-size: 16px; cursor: pointer; font-weight: 700; transition: 0.2s; text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; }
        
        .btn-calc { background: var(--primary); color: white; }
        .btn-steps { background: var(--secondary); color: white; display: none; }
        
        #resultado-box { 
            margin-top: 25px; 
            padding: 25px; 
            border-radius: 18px; 
            background: #ffffff; 
            border: 1px solid #e2e8f0;
            min-height: 120px;
            overflow-x: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }
        .error { color: #ef4444; font-size: 1rem; }
    </style>
</head>
<body>

<div class="card">
    <h2>Calculadora de Integrales</h2>
    
    <div class="input-area">
        <input type="text" id="entrada" placeholder="Escribe aquí, ej: ln(x+1)" onkeypress="if(event.key==='Enter') calcular()">
    </div>
    
    <div class="btn-group">
        <button class="btn-calc" onclick="calcular()">Calcular</button>
        <a id="btnPasos" class="btn-link btn-steps" target="_blank">Paso a paso ↗</a>
    </div>
    
    <div id="resultado-box">
        <div id="salida">Esperando tu función...</div>
    </div>
</div>

<script>
    // Esta función limpia el LaTeX para que se vea como MathDF
    function formatearLatex(tex) {
        if (!tex) return "";
        
        return tex
            // 1. Convertir logaritmos a ln
            .replace(/\\log/g, '\\ln')
            // 2. Quitar paréntesis solo si es una variable simple: ln(x) -> ln x
            .replace(/\\ln\\left\(([a-z0-9])\\right\)/g, '\\ln $1')
            .replace(/\\sin\\left\(([a-z0-9])\\right\)/g, '\\sin $1')
            .replace(/\\cos\\left\(([a-z0-9])\\right\)/g, '\\cos $1')
            .replace(/\\tan\\left\(([a-z0-9])\\right\)/g, '\\tan $1')
            // 3. Estética: Quitar puntos de multiplicación innecesarios
            .replace(/\\cdot/g, ' ');
    }

    function calcular() {
        const entradaOriginal = document.getElementById('entrada').value.trim();
        const salida = document.getElementById('salida');
        const btnPasos = document.getElementById('btnPasos');

        if (!entradaOriginal) return;

        salida.innerHTML = "Calculando...";

        // CORRECCIÓN PARA EL ERROR DE LA IMAGEN:
        // Nerdamer necesita 'log' para entender que es Logaritmo Natural.
        // Reemplazamos 'ln' por 'log' antes de procesar.
        let inputParaMotor = entradaOriginal.replace(/ln/g, 'log');

        setTimeout(() => {
            try {
                // 1. Resolvemos la integral
                let integral = nerdamer('integrate(' + inputParaMotor + ', x)');
                
                // 2. Convertimos a LaTeX y limpiamos la estética
                let resultadoLatex = formatearLatex(integral.toTeX());
                let entradaLatex = formatearLatex(nerdamer(inputParaMotor).toTeX());

                // 3. Mostramos el resultado
                salida.innerHTML = `\\[ \\int {${entradaLatex}} \\, dx = ${resultadoLatex} + C \\]`;
                
                // 4. Pedimos a MathJax que dibuje la fórmula
                MathJax.typesetPromise([salida]);

                // 5. Configuramos el botón de MathDF (usando la entrada original)
                btnPasos.href = "https://mathdf.com/int/es/#expr=" + encodeURIComponent(entradaOriginal);
                btnPasos.style.display = "flex";

            } catch (e) {
                console.error(e);
                salida.innerHTML = "<span class='error'>❌ Error: No se pudo resolver. Revisa los paréntesis o usa '*' para multiplicar (ej: 5*x).</span>";
                btnPasos.style.display = "none";
            }
        }, 100);
    }
</script>

</body>
</html>
